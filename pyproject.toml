[build-system]
# The package has no runtime dependencies; only the build backend is pinned.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puppet-edge-picker"
dynamic = ["version"]
description = "Verified Puppet Cube phase-3 edge algorithm picker with bounded macro search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denys Shkola" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["puppet-cube", "twisty-puzzle", "permutation-group", "breadth-first-search", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.urls]
Repository = "https://github.com/AlphaShk/puppet-cube-solver"

[project.scripts]
puppet-edge-picker = "puppet_edge_picker.main:main"

[tool.setuptools]
packages = ["puppet_edge_picker"]

[tool.setuptools.dynamic]
version = { attr = "puppet_edge_picker.__version__" }

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["puppet_edge_picker", "tests", "scripts"]
# typeshed leaves ttk's state()/instate() unannotated.
untyped_calls_exclude = ["tkinter.ttk"]
